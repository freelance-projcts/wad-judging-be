openapi: 3.0.3
info:
  title: WAD Judging System API
  version: "1.0.0"
  description: >
    REST API for the WAD Judging System - a role-based platform for managing
    students, events, teams, judges, marks entry, edit-request approvals and
    results for a judged performance competition.
servers:
  - url: /api
tags:
  - name: Dashboard
  - name: Auth
  - name: Students
  - name: Events
  - name: Judges
  - name: Performances
  - name: Marks
  - name: Edit Requests
  - name: Notifications
  - name: Results
  - name: Profile
  - name: Upload

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: wad_session
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
    User:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [ADMIN, JUDGE] }
        avatarUrl: { type: string, nullable: true }
    Student:
      type: object
      properties:
        id: { type: string }
        code: { type: string }
        fullName: { type: string }
        gender: { type: string, enum: [MALE, FEMALE, OTHER] }
        province:
          type: string
          enum: [WESTERN, CENTRAL, SOUTHERN, NORTHERN, EASTERN, NORTH_WESTERN, NORTH_CENTRAL, UVA, SABARAGAMUWA]
        team: { type: string, enum: [A, B], nullable: true }
        photoUrl: { type: string, nullable: true }
    Event:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        gender: { type: string, enum: [MALE, FEMALE, OTHER] }
    Performance:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        order: { type: integer }
    MarkEntry:
      type: object
      properties:
        id: { type: string }
        studentId: { type: string }
        eventId: { type: string }
        performanceId: { type: string }
        round: { type: integer, description: "1, or 2 if the event's supportsMultipleRounds is true" }
        dScore: { type: string }
        e1Score: { type: string }
        e2Score: { type: string }
        e3Score: { type: string }
        e4Score: { type: string }
        penaltyScore: { type: string }
        finalScore: { type: string }
        scoreBreakdown:
          type: object
          properties:
            countedEScores: { type: array, items: { type: number }, minItems: 2, maxItems: 2 }
            ignoredEScores:
              type: object
              properties: { min: { type: number }, max: { type: number } }
            eAverage: { type: number }
            finalScore: { type: number }
    EditRequest:
      type: object
      properties:
        id: { type: string }
        markEntryId: { type: string }
        requesterId: { type: string }
        status: { type: string, enum: [PENDING, APPROVED, REJECTED] }
        reason: { type: string, nullable: true }

security:
  - cookieAuth: []

paths:
  /dashboard:
    get:
      tags: [Dashboard]
      summary: Admin dashboard summary counts (admin only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalStudents: { type: integer }
                  totalEvents: { type: integer }
                  pendingRequests:
                    type: object
                    properties:
                      total: { type: integer }
                      scoreChangeRequests: { type: integer }
        "403":
          description: Admin access required

  /auth/register:
    post:
      tags: [Auth]
      summary: Self-register a new judge account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
      responses:
        "200":
          description: Account created, session cookie set
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/User" }
        "409":
          description: Email already registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/login:
    post:
      tags: [Auth]
      summary: Sign in with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: Signed in, session cookie set
        "401":
          description: Invalid credentials

  /auth/logout:
    post:
      tags: [Auth]
      summary: Clear the current session
      responses:
        "200":
          description: Logged out

  /auth/me:
    get:
      tags: [Auth]
      summary: Get the current session's user and (for judges) assigned performances
      responses:
        "200":
          description: Current user (or null if not authenticated)

  /students:
    get:
      tags: [Students]
      summary: List/search students
      parameters:
        - in: query
          name: search
          schema: { type: string }
          description: "Search by name or ID code (alias: q)"
        - in: query
          name: gender
          schema: { type: string, enum: [MALE, FEMALE, OTHER] }
        - in: query
          name: province
          schema: { type: string }
        - in: query
          name: team
          schema: { type: string, enum: [A, B] }
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, default: 20 }
          description: Capped at 100
      responses:
        "200":
          description: Paginated list of students
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Student" }
                  total: { type: integer }
                  page: { type: integer }
                  pageSize: { type: integer }
                  totalPages: { type: integer }
    post:
      tags: [Students]
      summary: Create a student (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Student" }
      responses:
        "201":
          description: Student created
        "403":
          description: Admin access required

  /students/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    get:
      tags: [Students]
      summary: Get a student by id
      responses:
        "200": { description: OK }
        "404": { description: Not found }
    patch:
      tags: [Students]
      summary: Update a student (admin only)
      responses:
        "200": { description: Updated }
    delete:
      tags: [Students]
      summary: Delete a student (admin only, blocked if marks exist)
      responses:
        "200": { description: Deleted }
        "409": { description: Student has recorded marks }

  /events:
    get:
      tags: [Events]
      summary: List events, optionally filtered by gender
      responses:
        "200": { description: OK }
    post:
      tags: [Events]
      summary: Create an event (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, gender]
              properties:
                name: { type: string }
                gender: { type: string, enum: [MALE, FEMALE, OTHER] }
                defaultPerformanceId: { type: string, nullable: true, description: "Which performance's marks count toward All-Rounders for this event" }
                supportsMultipleRounds: { type: boolean, default: false, description: "Whether this event accepts a round 2 mark submission" }
      responses:
        "201": { description: Created }

  /events/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    patch:
      tags: [Events]
      summary: Update an event (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, gender]
              properties:
                name: { type: string }
                gender: { type: string, enum: [MALE, FEMALE, OTHER] }
                defaultPerformanceId: { type: string, nullable: true }
                supportsMultipleRounds: { type: boolean, description: "Omit to leave unchanged" }
      responses:
        "200": { description: Updated }
    delete:
      tags: [Events]
      summary: Delete an event (admin only, blocked if marks exist)
      responses:
        "200": { description: Deleted }

  /judges:
    get:
      tags: [Judges]
      summary: List judges with their performance assignments (admin only)
      responses:
        "200": { description: OK }

  /judges/{id}/performances:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    post:
      tags: [Judges]
      summary: Grant a judge access to a performance (admin only)
      responses:
        "201": { description: Granted }
    delete:
      tags: [Judges]
      summary: Revoke a judge's access to a performance (admin only)
      parameters:
        - in: query
          name: performanceId
          required: true
          schema: { type: string }
      responses:
        "200": { description: Revoked }

  /performances:
    get:
      tags: [Performances]
      summary: List performances
      responses:
        "200": { description: OK }

  /marks:
    get:
      tags: [Marks]
      summary: List mark entries, optionally filtered
      description: >
        If performanceId is omitted, a judge is scoped to their own assigned
        performance(s); an admin sees everything. gender/province/team filter
        through the student relation.
      parameters:
        - in: query
          name: performanceId
          schema: { type: string }
        - in: query
          name: eventId
          schema: { type: string }
        - in: query
          name: studentId
          schema: { type: string }
        - in: query
          name: gender
          schema: { type: string, enum: [MALE, FEMALE, OTHER] }
        - in: query
          name: province
          schema: { type: string }
        - in: query
          name: team
          schema: { type: string, enum: [A, B] }
      responses:
        "200": { description: OK }
        "403": { description: Not assigned to this performance }
    post:
      tags: [Marks]
      summary: Create or update a mark entry for a student/event/performance/round
      description: >
        The identity is (studentId, eventId, performanceId, round). Most
        events are single-round (round defaults to 1); a configurable subset
        of events (Event.supportsMultipleRounds) also accept round 2 -
        submitting round 2 for an event that doesn't support it returns 400.
        Creating a brand-new entry for a given round is always allowed for an
        assigned judge. Editing an existing entry requires the judge to hold
        an APPROVED, unconsumed edit request for that specific mark entry (or
        be an admin) - each round's approval is tracked separately.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [studentId, eventId, performanceId, scores]
              properties:
                studentId: { type: string }
                eventId: { type: string }
                performanceId: { type: string }
                round: { type: integer, minimum: 1, maximum: 2, default: 1 }
                scores:
                  type: object
                  required: [D, E1, E2, E3, E4]
                  properties:
                    D: { type: number }
                    E1: { type: number }
                    E2: { type: number }
                    E3: { type: number }
                    E4: { type: number }
                    P: { type: number, default: 0 }
      responses:
        "201": { description: Mark saved }
        "400": { description: round 2 requested but this event does not support multiple rounds }
        "403": { description: Editing requires an approved edit request }

  /marks/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    get:
      tags: [Marks]
      summary: Get a single mark entry
      responses:
        "200": { description: OK }
    put:
      tags: [Marks]
      summary: Edit an existing mark entry's scores (always requires an approved edit request, or admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [D, E1, E2, E3, E4]
              properties:
                D: { type: number }
                E1: { type: number }
                E2: { type: number }
                E3: { type: number }
                E4: { type: number }
                P: { type: number, default: 0 }
      responses:
        "200": { description: Mark updated }
        "403": { description: Editing requires an approved edit request }
        "404": { description: Mark entry not found }

  /edit-requests:
    get:
      tags: [Edit Requests]
      summary: List edit requests (admin sees all, judge sees own)
      responses:
        "200": { description: OK }
    post:
      tags: [Edit Requests]
      summary: A judge requests permission to edit an already-submitted mark entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [markEntryId]
              properties:
                markEntryId: { type: string }
                reason: { type: string, nullable: true }
      responses:
        "201": { description: Request created }

  /edit-requests/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    patch:
      tags: [Edit Requests]
      summary: Approve or reject a pending edit request (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [APPROVED, REJECTED] }
      responses:
        "200": { description: Resolved }

  /notifications:
    get:
      tags: [Notifications]
      summary: Recent mark-entry activity across all performances (admin only)
      responses:
        "200": { description: OK }

  /results/team-performance:
    get:
      tags: [Results]
      summary: Team Performance - Performance 1, event-specific, province -> Team A/B -> top 5 -> teamTotal
      parameters:
        - in: query
          name: eventId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  eventId: { type: string }
                  eventName: { type: string }
                  performanceId: { type: string }
                  performanceName: { type: string }
                  provinces:
                    type: array
                    items:
                      type: object
                      properties:
                        province: { type: string }
                        provinceLabel: { type: string }
                        teams:
                          type: array
                          items:
                            type: object
                            properties:
                              team: { type: string, enum: [A, B] }
                              teamTotal: { type: number }
                              countedStudentCount: { type: integer }
                              students:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    rank: { type: integer }
                                    studentId: { type: string }
                                    code: { type: string }
                                    fullName: { type: string }
                                    finalScore: { type: number }
                                    countedTowardTotal: { type: boolean }
        "400": { description: eventId is required }
        "403": { description: Not assigned to Performance 1 }

  /results/top-eight:
    get:
      tags: [Results]
      summary: Top Eight - Performance 1, event-specific, ignores team, top 3 (plus ties) per province
      parameters:
        - in: query
          name: eventId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  eventId: { type: string }
                  eventName: { type: string }
                  performanceId: { type: string }
                  performanceName: { type: string }
                  provinces:
                    type: array
                    items:
                      type: object
                      properties:
                        province: { type: string }
                        provinceLabel: { type: string }
                        students:
                          type: array
                          items:
                            type: object
                            properties:
                              rank: { type: integer }
                              studentId: { type: string }
                              code: { type: string }
                              fullName: { type: string }
                              team: { type: string, nullable: true, enum: [A, B, null] }
                              finalScore: { type: number }
        "400": { description: eventId is required }
        "403": { description: Not assigned to Performance 1 }

  /results/performance-two:
    get:
      tags: [Results]
      summary: Performance Two - same formula, flat top 8 (plus ties at the cutoff, never truncated)
      parameters:
        - in: query
          name: eventId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  eventId: { type: string }
                  eventName: { type: string }
                  performanceId: { type: string }
                  performanceName: { type: string }
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        rank: { type: integer }
                        studentId: { type: string }
                        code: { type: string }
                        fullName: { type: string }
                        province: { type: string }
                        provinceLabel: { type: string }
                        team: { type: string, nullable: true, enum: [A, B, null] }
                        finalScore: { type: number }
        "400": { description: eventId is required }
        "403": { description: Not assigned to Performance 2 }

  /results/all-rounders:
    get:
      tags: [Results]
      summary: All Rounders - cross-event total using each event's configured performance (admin only)
      parameters:
        - in: query
          name: gender
          schema: { type: string, enum: [MALE, FEMALE, OTHER] }
        - in: query
          name: province
          schema: { type: string }
        - in: query
          name: team
          schema: { type: string, enum: [A, B] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name: { type: string }
                        performanceId: { type: string }
                        performanceName: { type: string }
                  students:
                    type: array
                    items:
                      type: object
                      properties:
                        rank: { type: integer }
                        studentId: { type: string }
                        code: { type: string }
                        fullName: { type: string }
                        gender: { type: string }
                        province: { type: string }
                        team: { type: string, nullable: true, enum: [A, B, null] }
                        totalScore: { type: number }
                        eventsScored: { type: integer }
                        events:
                          type: array
                          items:
                            type: object
                            properties:
                              eventId: { type: string }
                              eventName: { type: string }
                              performanceId: { type: string }
                              performanceName: { type: string }
                              hasMark: { type: boolean }
                              finalScore: { type: number, nullable: true }
        "403": { description: Admin access required }

  /results/download:
    get:
      tags: [Results]
      summary: Download results as CSV for a performance/gender (optionally one event)
      parameters:
        - in: query
          name: performanceId
          required: true
          schema: { type: string }
        - in: query
          name: gender
          required: true
          schema: { type: string, enum: [MALE, FEMALE, OTHER] }
        - in: query
          name: eventId
          schema: { type: string }
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema: { type: string }

  /profile:
    get:
      tags: [Profile]
      summary: Get the current user's profile and assigned performances (if a judge)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/User" }
                  performances:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name: { type: string }
                        order: { type: integer }
        "401": { description: Not authenticated }
    patch:
      tags: [Profile]
      summary: Update the current user's name and/or avatar
      responses:
        "200": { description: Updated }

  /profile/change-password:
    post:
      tags: [Profile]
      summary: Change the current user's password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword, confirmPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 8 }
                confirmPassword: { type: string }
      responses:
        "200": { description: Password changed }
        "400": { description: Current password incorrect, or newPassword/confirmPassword do not match }
        "401": { description: Not authenticated }

  /upload:
    post:
      tags: [Upload]
      summary: Upload an image (student photo or avatar) via multipart/form-data
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Uploaded file URL
